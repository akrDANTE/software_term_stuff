        }

            font-size: 0.95rem;
        }
        .meta-item strong {
            color: var(--text-muted);
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;

        }
        .content {
            padding: 24px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 60vh;
        }
        .section-title {
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);

            margin-top: 25px;
        }
        ul {
            padding-left: 20px;

        }
        .executive-summary {

            padding: 15px;
            margin: 20px 0;
            font-style: italic;
            border-radius: 0 8px 8px 0;
            line-height: 1.6;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: #f1f5f9;
            border-top: 1px solid var(--border);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;

        }

        }
        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .counter {
            font-weight: 600;
            color: var(--text-muted);

        let currentIndex = 0;

        function renderTender(index) {
            if (!tenderData || tenderData.length === 0) return;
            
            const data = tenderData[index];

            // Update Header & Links
            const titleLink = document.getElementById('ui-title-link');
            titleLink.textContent = data.tender_id_or_number || data.filename;
            titleLink.href = data.source_url;

            // Update Meta info
            document.getElementById('ui-org').textContent = data.buyer_organization || "N/A";
            document.getElementById('ui-deadline').textContent = data.submission_deadline || "N/A";
            document.getElementById('ui-duration').textContent = data.contract_duration_or_delivery_period || "N/A";
            document.getElementById('ui-emd').textContent = data.emD_required ? "Yes" : "No";

            // Update Executive Summary
            document.getElementById('ui-summary').textContent = data.executive_summary || "No summary provided.";

            // Update Lists (Items & Tech Reqs)
            const itemsList = document.getElementById('ui-items');
            itemsList.innerHTML = '';
            (data.items_requested || []).forEach(item => {
                let li = document.createElement('li');
                li.textContent = item;
                itemsList.appendChild(li);
            });

            const techList = document.getElementById('ui-tech-reqs');
            techList.innerHTML = '';
            (data.key_technical_requirements || []).forEach(req => {
                let li = document.createElement('li');
                li.textContent = req;
                techList.appendChild(li);
            });

            // Update Counter & Buttons
            document.getElementById('ui-counter').textContent = index + 1;
            document.getElementById('ui-total').textContent = tenderData.length;
            
            document.getElementById('btn-prev').disabled = (index === 0);
            document.getElementById('btn-next').disabled = (index === tenderData.length - 1);
        }

        function navigate(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= tenderData.length) currentIndex = tenderData.length - 1;
            renderTender(currentIndex);
        }

        // Handle Keyboard Navigation (Left/Right Arrows)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') navigate(1);
            if (e.key === 'ArrowLeft') navigate(-1);
        });

        // Initial Render
        window.onload = () => renderTender(currentIndex);
    </script>
